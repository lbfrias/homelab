---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dnsdist-config
  namespace: dns
data:
  dnsdist.conf: |
    -- dnsdist configuration for homelab DNS load balancing
    -- Distributes queries across 3 Technitium backends in round-robin

    -- Define backend Technitium servers (macvlan IPs from Whereabouts range)
    newServer({
      address = "10.0.0.95:53",
      name = "technitium-0",
      checkName = "google.com",
      checkInterval = 5,
      maxCheckFailures = 3,
      useClientSubnet = true
    })

    newServer({
      address = "10.0.0.96:53",
      name = "technitium-1",
      checkName = "google.com",
      checkInterval = 5,
      maxCheckFailures = 3,
      useClientSubnet = true
    })

    newServer({
      address = "10.0.0.97:53",
      name = "technitium-2",
      checkName = "google.com",
      checkInterval = 5,
      maxCheckFailures = 3,
      useClientSubnet = true
    })

    -- EDNS Client Subnet: pass full client IP (/32 for IPv4, /128 for IPv6)
    setECSSourcePrefixV4(32)
    setECSSourcePrefixV6(128)

    -- Round-robin load balancing policy (default)
    setServerPolicy(roundrobin)

    -- Listen on all interfaces (macvlan will provide external IP)
    setLocal("0.0.0.0:53")

    -- Logging
    setVerboseHealthChecks(true)
