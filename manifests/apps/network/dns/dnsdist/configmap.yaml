---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dnsdist-config
  namespace: dns
data:
  dnsdist.conf: |
    -- dnsdist configuration for homelab DNS load balancing
    -- Distributes queries across 3 Technitium backends in round-robin

    -- Define backend Technitium servers (macvlan IPs from Whereabouts range)
    -- Port 538 = Technitium's PROXY protocol port for DNS
    -- useProxyProtocol sends real client IP to Technitium for logging
    newServer({
      address = "10.0.0.95:538",
      name = "technitium-0",
      checkName = "google.com",
      checkInterval = 5,
      maxCheckFailures = 3,
      useProxyProtocol = true,
      healthCheckPort = 53  -- Health checks use regular DNS port
    })

    newServer({
      address = "10.0.0.96:538",
      name = "technitium-1",
      checkName = "google.com",
      checkInterval = 5,
      maxCheckFailures = 3,
      useProxyProtocol = true,
      healthCheckPort = 53
    })

    newServer({
      address = "10.0.0.97:538",
      name = "technitium-2",
      checkName = "google.com",
      checkInterval = 5,
      maxCheckFailures = 3,
      useProxyProtocol = true,
      healthCheckPort = 53
    })

    -- Round-robin load balancing policy (default)
    setServerPolicy(roundrobin)

    -- Listen on all interfaces (macvlan will provide external IP)
    setLocal("0.0.0.0:53")

    -- Logging
    setVerboseHealthChecks(true)
