---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dnsdist-config
  namespace: dns
data:
  dnsdist.conf: |
    -- dnsdist configuration for homelab DNS load balancing
    -- Distributes queries across 3 Technitium backends via k8s network
    -- IPs are resolved from StatefulSet DNS names by init container

    -- Define backend Technitium servers (IPs injected by init container)
    -- Port 538 = Technitium's PROXY protocol port
    -- useProxyProtocol sends real client IP to Technitium for logging
    -- Health checks work on port 538 since Technitium v15.0+ handles PROXY queries without source address
    newServer({
      address = "TECHNITIUM_0_IP:538",
      name = "technitium-0",
      checkName = "google.com",
      checkInterval = 5,
      maxCheckFailures = 3,
      useProxyProtocol = true
    })

    newServer({
      address = "TECHNITIUM_1_IP:538",
      name = "technitium-1",
      checkName = "google.com",
      checkInterval = 5,
      maxCheckFailures = 3,
      useProxyProtocol = true
    })

    newServer({
      address = "TECHNITIUM_2_IP:538",
      name = "technitium-2",
      checkName = "google.com",
      checkInterval = 5,
      maxCheckFailures = 3,
      useProxyProtocol = true
    })

    -- Round-robin load balancing policy (default)
    setServerPolicy(roundrobin)

    -- Listen on all interfaces (macvlan will provide external IP)
    setLocal("0.0.0.0:53")

    -- Logging
    setVerboseHealthChecks(true)
