---
# dnsdist DNS load balancer
# Uses anti-affinity to spread across nodes + Whereabouts IPAM for .98-.99
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnsdist
  namespace: dns
  labels:
    app: dnsdist
spec:
  replicas: 2
  # maxSurge: 0 ensures old pod terminates before new one starts
  # Required when using Whereabouts IPAM with limited IP range
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: dnsdist
  template:
    metadata:
      labels:
        app: dnsdist
      annotations:
        # Whereabouts IPAM assigns from 10.0.0.98-99 range
        k8s.v1.cni.cncf.io/networks: macvlan-dns-dnsdist
    spec:
      shareProcessNamespace: true
      initContainers:
        # Resolve StatefulSet pod DNS names to IPs for dnsdist config
        - name: resolve-backends
          image: busybox:1.38
          command: ["/bin/sh", "/scripts/resolve-backends.sh", "once"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: config-template
              mountPath: /etc/dnsdist-template
              readOnly: true
            - name: config
              mountPath: /etc/dnsdist
      containers:
        - name: dnsdist
          image: powerdns/dnsdist-20:2.0.9
          args:
            - --config=/etc/dnsdist/dnsdist.conf
            - --supervised
          ports:
            - containerPort: 53
              name: dns-udp
              protocol: UDP
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/dnsdist
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 50m
              memory: 150Mi
        # Sidecar that watches Technitium pod IPs and restarts dnsdist if they change.
        # Container restarts do NOT re-run init containers, so the sidecar must
        # regenerate the config itself and then kill dnsdist (shareProcessNamespace).
        - name: watch-backends
          image: busybox:1.38
          command: ["/bin/sh", "/scripts/resolve-backends.sh", "watch"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: config-template
              mountPath: /etc/dnsdist-template
              readOnly: true
            - name: config
              mountPath: /etc/dnsdist
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 16Mi
      volumes:
        - name: scripts
          configMap:
            name: dnsdist-scripts
        - name: config-template
          configMap:
            name: dnsdist-config
        - name: config
          emptyDir: {}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: dnsdist
              topologyKey: kubernetes.io/hostname
