---
# dnsdist DNS load balancer
# Uses anti-affinity to spread across nodes + Whereabouts IPAM for .98-.99
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnsdist
  namespace: dns
  labels:
    app: dnsdist
spec:
  replicas: 2
  # maxSurge: 0 ensures old pod terminates before new one starts
  # Required when using Whereabouts IPAM with limited IP range
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: dnsdist
  template:
    metadata:
      labels:
        app: dnsdist
      annotations:
        # Whereabouts IPAM assigns from 10.0.0.98-99 range
        k8s.v1.cni.cncf.io/networks: macvlan-dns-dnsdist
    spec:
      containers:
        - name: dnsdist
          image: powerdns/dnsdist-20:2.0.8
          args:
            - --config=/etc/dnsdist/dnsdist.conf
            - --supervised
          ports:
            - containerPort: 53
              name: dns-udp
              protocol: UDP
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/dnsdist
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: dnsdist-config
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: dnsdist
              topologyKey: kubernetes.io/hostname
