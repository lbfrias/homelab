---
# Technitium DNS DaemonSet
# Runs one pod per node natively (DaemonSet)
# Each pod gets a unique macvlan IP from Whereabouts IPAM (10.0.0.95-97)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: technitium
  namespace: dns
  labels:
    app: technitium
spec:
  selector:
    matchLabels:
      app: technitium
  template:
    metadata:
      labels:
        app: technitium
      annotations:
        # Whereabouts IPAM assigns from 10.0.0.95-97 range
        k8s.v1.cni.cncf.io/networks: macvlan-dns-technitium
    spec:
      automountServiceAccountToken: false
      containers:
        - name: technitium
          image: technitium/dns-server:15.4.0
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DNS_SERVER_DOMAIN
              value: "technitium-$(NODE_NAME)"
            - name: DNS_SERVER_ADMIN_PASSWORD_FILE
              value: "/secrets/admin-password"
            - name: DNS_SERVER_PREFER_IPV6
              value: "false"
            - name: DNS_SERVER_FORWARDERS
              value: "1.1.1.1,1.0.0.1,9.9.9.9,149.112.112.112"
            - name: DNS_SERVER_ENABLE_BLOCKING
              value: "true"
            - name: DNS_SERVER_BLOCK_LIST_URLS
              value: "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
          ports:
            - containerPort: 53
              name: dns-udp
              protocol: UDP
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
            - containerPort: 5380
              name: http
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/dns
            - name: admin-password
              mountPath: /secrets
              readOnly: true
            - name: run
              mountPath: /run
            - name: status
              mountPath: /status
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "test -f /status/configured"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: 5380
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
        # Sidecar to configure Technitium via API (has wget)
        - name: configure
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              /scripts/configure-proxy.sh && touch /status/configured
              echo "Configuration complete, sleeping..."
              sleep infinity
          volumeMounts:
            - name: admin-password
              mountPath: /secrets
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: status
              mountPath: /status
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
      volumes:
        - name: admin-password
          secret:
            secretName: technitium-admin-password
        - name: config
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: status
          emptyDir: {}
        - name: scripts
          configMap:
            name: technitium-scripts
            defaultMode: 0755
