---
apiVersion: v1
kind: ConfigMap
metadata:
  name: technitium-scripts
  namespace: dns
data:
  configure-proxy.sh: |
    #!/bin/sh
    # Configure Technitium PROXY protocol and DNS records via API
    # Runs as post-start hook after container starts
    
    set -e
    
    API_URL="http://localhost:5380/api"
    PASSWORD_FILE="/secrets/admin-password"
    MAX_RETRIES=30
    RETRY_INTERVAL=2
    
    # dnsdist pod network CIDR for PROXY protocol traffic
    PROXY_ACL='10.42.0.0/16'
    
    log() {
      echo "[configure-proxy] $1"
    }
    
    # Wait for Technitium HTTP API to be ready
    log "Waiting for Technitium API..."
    retries=0
    until wget -q -O /dev/null "$API_URL/user/login" 2>/dev/null; do
      retries=$((retries + 1))
      if [ $retries -ge $MAX_RETRIES ]; then
        log "ERROR: Technitium API not ready after $MAX_RETRIES attempts"
        exit 1
      fi
      sleep $RETRY_INTERVAL
    done
    log "API is ready"
    
    # Read password and URL-encode it
    PASSWORD=$(cat "$PASSWORD_FILE")
    ENCODED_PASS=$(echo -n "$PASSWORD" | sed 's/+/%2B/g; s/ /%20/g; s/&/%26/g')
    
    # Login to get token
    log "Logging in..."
    RESPONSE=$(wget -q -O - "$API_URL/user/login?user=admin&pass=$ENCODED_PASS")
    TOKEN=$(echo "$RESPONSE" | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
    
    if [ -z "$TOKEN" ]; then
      log "ERROR: Failed to get API token"
      exit 1
    fi
    log "Got API token"
    
    # Configure PROXY protocol settings
    log "Configuring DNS server settings (PROXY protocol, DoT forwarders, cache)..."
    SETTINGS_URL="$API_URL/settings/set?token=$TOKEN"
    SETTINGS_URL="$SETTINGS_URL&enableDnsOverUdpProxy=true"
    SETTINGS_URL="$SETTINGS_URL&enableDnsOverTcpProxy=true"
    SETTINGS_URL="$SETTINGS_URL&dnsOverUdpProxyPort=538"
    SETTINGS_URL="$SETTINGS_URL&dnsOverTcpProxyPort=538"
    SETTINGS_URL="$SETTINGS_URL&loggingType=Console"
    
    # No URL encoding needed for comma-separated ACL
    SETTINGS_URL="$SETTINGS_URL&dnsReverseProxyNetworkACL=$PROXY_ACL"

    # Forward over DNS-over-TLS instead of plain UDP.
    # Plain UDP has no retransmission, so a single dropped packet upstream
    # surfaces as a client-visible SERVFAIL. TLS runs over TCP, which
    # retransmits lost segments, making resolution resilient to packet loss.
    # Format is "domain (ip)": the domain is used for certificate validation
    # and the IP avoids a bootstrap dependency on resolving the domain first.
    # %20 encodes the space required by that format.
    SETTINGS_URL="$SETTINGS_URL&forwarderProtocol=Tls"
    SETTINGS_URL="$SETTINGS_URL&forwarders=cloudflare-dns.com%20(1.1.1.1),cloudflare-dns.com%20(1.0.0.1),dns.quad9.net%20(9.9.9.9),dns.quad9.net%20(149.112.112.112)"

    # 10000 (the default) is small for a whole-network resolver; entries evict
    # quickly and force constant upstream lookups. Each lookup is another
    # chance to hit upstream packet loss.
    SETTINGS_URL="$SETTINGS_URL&cacheMaximumEntries=100000"
    
    RESPONSE=$(wget -q -O - "$SETTINGS_URL")
    STATUS=$(echo "$RESPONSE" | grep -o '"status":"[^"]*"' | cut -d'"' -f4)
    
    if [ "$STATUS" = "ok" ]; then
      log "DNS server settings configured successfully"
    else
      log "WARNING: Settings may not have applied: $RESPONSE"
    fi
    
    # Create frias.app zone (primary/authoritative)
    log "Creating frias.app zone..."
    RESPONSE=$(wget -q -O - "$API_URL/zones/create?token=$TOKEN&zone=frias.app&type=Primary")
    STATUS=$(echo "$RESPONSE" | grep -o '"status":"[^"]*"' | cut -d'"' -f4)
    if [ "$STATUS" = "ok" ]; then
      log "Zone frias.app created"
    else
      log "Zone frias.app may already exist or failed: $RESPONSE"
    fi
    
    # Add wildcard DNS record for ingress: *.frias.app -> 10.0.0.30 (NGINX Ingress)
    log "Adding *.frias.app wildcard A record for NGINX Ingress..."
    RESPONSE=$(wget -q -O - "$API_URL/zones/records/add?token=$TOKEN&zone=frias.app&domain=*.frias.app&type=A&ipAddress=10.0.0.30&ttl=3600&overwrite=true")
    STATUS=$(echo "$RESPONSE" | grep -o '"status":"[^"]*"' | cut -d'"' -f4)
    if [ "$STATUS" = "ok" ]; then
      log "DNS record *.frias.app -> 10.0.0.30 added"
    else
      log "Wildcard DNS record may already exist or failed: $RESPONSE"
    fi
    
    log "Configuration complete"
