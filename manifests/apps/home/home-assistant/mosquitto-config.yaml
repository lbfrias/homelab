---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: home
data:
  mosquitto.conf: |
    # Persistence
    persistence true
    persistence_location /mosquitto/data/

    # Logging
    log_dest stdout
    log_type all

    # Listener on 1883 (localhost only within pod - not externally exposed)
    # Home Assistant connects via localhost:1883 as a sidecar container
    listener 1883
    allow_anonymous true
