---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home
  labels:
    app: home-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
      annotations:
        # Attach to IoT VLAN for mDNS/SSDP device discovery
        # Static IP 10.0.30.150 via static IPAM
        k8s.v1.cni.cncf.io/networks: |
          [{
            "name": "macvlan-iot",
            "namespace": "default",
            "ips": ["10.0.30.150/24"]
          }]
    spec:
      hostname: home-assistant
      containers:
      - name: home-assistant
        image: ghcr.io/home-assistant/home-assistant:2026.8.0
        env:
        - name: TZ
          value: "Asia/Manila"
        ports:
        - containerPort: 8123
          name: http
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /config
        securityContext:
          privileged: true
      - name: mosquitto
        image: eclipse-mosquitto:2.0.22
        ports:
        - containerPort: 1883
          name: mqtt
          protocol: TCP
        volumeMounts:
        - name: mosquitto-config
          mountPath: /mosquitto/config/mosquitto.conf
          subPath: mosquitto.conf
        - name: mosquitto-data
          mountPath: /mosquitto/data
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: home-assistant-pvc
      - name: mosquitto-config
        configMap:
          name: mosquitto-config
      - name: mosquitto-data
        emptyDir: {}
      restartPolicy: Always
      # Pin to xialing (only node with eno1.300 VLAN interface configured)
      nodeName: xialing
