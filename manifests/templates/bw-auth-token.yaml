---
# Bitwarden SM auth token — create once, mirrored to specified namespaces by Reflector
#
# Usage:
#   1. Replace <YOUR_BASE64_ENCODED_TOKEN> with your token (base64 encoded)
#      To encode: echo -n "your-token" | base64
#   2. Update reflection-allowed-namespaces with namespaces that need this secret
#   3. Apply: kubectl apply -f bw-auth-token.yaml
#
# Reflector copies this secret only to namespaces listed in the annotation.
apiVersion: v1
kind: Secret
metadata:
  name: bw-auth-token
  namespace: flux-system
  annotations:
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "tailscale,cert-manager"
type: Opaque
data:
  token: <YOUR_BASE64_ENCODED_TOKEN>
