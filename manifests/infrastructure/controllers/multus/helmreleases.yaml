---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: multus
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: rke2-multus
      version: "v4.3.008"
      sourceRef:
        kind: HelmRepository
        name: rke2-charts
        namespace: kube-system
  values:
    config:
      cni_conf:
        confDir: /var/lib/rancher/k3s/agent/etc/cni/net.d
        binDir: /var/lib/rancher/k3s/data/cni
        kubeconfig: /var/lib/rancher/k3s/agent/etc/cni/net.d/multus.d/multus.kubeconfig
        multusAutoconfigDir: /var/lib/rancher/k3s/agent/etc/cni/net.d
    pod:
      resources:
        enabled: true
        multus:
          requests:
            cpu: 100m
            memory: 50Mi
          limits:
            cpu: 100m
            memory: 50Mi
    # Whereabouts IPAM for dynamic IP assignment within ranges
    rke2-whereabouts:
      enabled: true
