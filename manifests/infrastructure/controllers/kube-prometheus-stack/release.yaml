---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: monitoring
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "72.6.2"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    # ========================================
    # Prometheus
    # ========================================
    prometheus:
      prometheusSpec:
        # Pin to xialing (16GB) — RPis are too small
        nodeSelector:
          kubernetes.io/hostname: xialing

        # Retention: 14 days for "two weekends" debugging window
        retention: 14d
        retentionSize: "15GB"

        # Storage: Longhorn PVC (arm64 nodes only)
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn-monitoring
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi

        # Resource limits for homelab
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi

        # Scrape all ServiceMonitors across namespaces
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false

    # ========================================
    # Grafana
    # ========================================
    grafana:
      # Pin to xialing
      nodeSelector:
        kubernetes.io/hostname: xialing

      # Admin password from Bitwarden Secrets Manager
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: password

      # Resource limits
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi

      # Persistence for dashboards/settings
      persistence:
        enabled: true
        storageClassName: longhorn-monitoring
        size: 5Gi

      # Ingress handled separately (in configs/monitoring)
      ingress:
        enabled: false

      # Default dashboards
      defaultDashboardsEnabled: true
      defaultDashboardsTimezone: Asia/Manila

      # Additional data sources (Loki added after loki chart deploys)
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki:3100
          access: proxy
          isDefault: false

      # Sidecar for auto-loading dashboards from ConfigMaps
      sidecar:
        dashboards:
          enabled: true
          searchNamespace: ALL

    # ========================================
    # Alertmanager
    # ========================================
    alertmanager:
      alertmanagerSpec:
        nodeSelector:
          kubernetes.io/hostname: xialing

        # Minimal resources — not heavily used initially
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi

        # Small storage for silences/alerts
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn-monitoring
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi

    # ========================================
    # Node Exporter (DaemonSet — runs on all nodes)
    # ========================================
    nodeExporter:
      enabled: true

    prometheus-node-exporter:
      # Lightweight — fine on RPis
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi

    # ========================================
    # Kube State Metrics
    # ========================================
    kube-state-metrics:
      nodeSelector:
        kubernetes.io/hostname: xialing

      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi

    # ========================================
    # K3s-specific: disable components not present
    # ========================================
    kubeEtcd:
      enabled: false  # K3s uses embedded etcd, not accessible via standard endpoint

    kubeControllerManager:
      enabled: false  # K3s bundles this differently

    kubeScheduler:
      enabled: false  # K3s bundles this differently

    kubeProxy:
      enabled: false  # K3s doesn't use kube-proxy by default
