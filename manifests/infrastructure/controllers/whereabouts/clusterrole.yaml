---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: whereabouts
rules:
  - apiGroups: ["whereabouts.cni.cncf.io"]
    resources:
      - ippools
      - overlappingrangeipreservations
    verbs:
      - "*"
  - apiGroups: ["coordination.k8s.io"]
    resources:
      - leases
    verbs:
      - "*"
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - list
      - watch
  - apiGroups: [""]
    resources:
      - nodes
    verbs:
      - get
  - apiGroups: ["k8s.cni.cncf.io"]
    resources:
      - network-attachment-definitions
    verbs:
      - get
      - list
      - watch
