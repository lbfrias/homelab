---
# StorageClass for monitoring stack
# 2 replicas on peggy/yelena only (xialing scheduling disabled in Longhorn)
# Retain policy — monitoring data is important for debugging
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-monitoring
provisioner: driver.longhorn.io
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
