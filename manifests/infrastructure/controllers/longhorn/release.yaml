---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1h
  url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1h
  # Longhorn's post-upgrade hook Job can exceed Helm's default 5m timeout
  # (observed ~5m30s), causing a false-negative "Failed" status.
  timeout: 15m
  chart:
    spec:
      chart: longhorn
      version: "1.12.1"
      sourceRef:
        kind: HelmRepository
        name: longhorn
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    persistence:
      # 2 replicas — xialing has ~79GB vs 1TB on RPis
      defaultClassReplicaCount: 2
    defaultSettings:
      # Backup target managed via BackupTarget CR (configs/longhorn/backup-target.yaml)
      # Store data on HDDs mounted at /var (per ADR-002)
      defaultDataPath: /var/lib/longhorn
      # Auto-upgrade attached volumes' engines to the default image after a
      # Longhorn upgrade (live upgrade), so engines don't lag behind. Does NOT
      # relocate an already-current engine off an old instance-manager — that
      # still requires detach/reattach of the volume.
      concurrentAutomaticEngineUpgradePerNodeLimit: 3
