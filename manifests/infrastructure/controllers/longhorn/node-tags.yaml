---
# Longhorn node configuration with tags for storage placement
# observability-storage tag: used by longhorn-observability StorageClass
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: peggy
  namespace: longhorn-system
spec:
  name: peggy
  allowScheduling: true
  tags:
    - observability-storage
---
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: yelena
  namespace: longhorn-system
spec:
  name: yelena
  allowScheduling: true
  tags:
    - observability-storage
---
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: xialing
  namespace: longhorn-system
spec:
  name: xialing
  allowScheduling: true
  tags: []
