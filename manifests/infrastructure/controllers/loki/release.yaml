---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 1h
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: "6.30.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
  values:
    # Single-binary mode for homelab (simpler, lower resource usage)
    deploymentMode: SingleBinary

    loki:
      # Auth disabled for internal use
      auth_enabled: false

      # Storage: filesystem (Longhorn PVC)
      storage:
        type: filesystem

      # Retention
      limits_config:
        retention_period: 336h  # 14 days

      # Schema config for filesystem storage
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h

      commonConfig:
        replication_factor: 1

    # Single binary deployment
    singleBinary:
      replicas: 1

      # Pin to xialing
      nodeSelector:
        kubernetes.io/hostname: xialing

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi

      persistence:
        enabled: true
        storageClass: longhorn-monitoring
        size: 20Gi

    # Disable distributed components (using SingleBinary mode)
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0

    # Gateway not needed in single binary mode
    gateway:
      enabled: false

    # Disable test pod
    test:
      enabled: false

    # Disable monitoring (we're already using kube-prometheus-stack)
    monitoring:
      selfMonitoring:
        enabled: false
        grafanaAgent:
          installOperator: false
      lokiCanary:
        enabled: false
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: promtail
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: promtail
      version: "6.16.6"
      sourceRef:
        kind: HelmRepository
        name: grafana
  values:
    config:
      clients:
        - url: http://loki:3100/loki/api/v1/push

    # DaemonSet runs on all nodes — lightweight
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi

    # Tolerate all taints to run on all nodes
    tolerations:
      - operator: Exists
