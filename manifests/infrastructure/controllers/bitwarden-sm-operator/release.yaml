---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bitwarden
  namespace: sm-operator-system
spec:
  interval: 1h
  url: https://charts.bitwarden.com/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sm-operator
  namespace: sm-operator-system
spec:
  interval: 1h
  chart:
    spec:
      chart: sm-operator
      version: "2.0.3"
      sourceRef:
        kind: HelmRepository
        name: bitwarden
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
