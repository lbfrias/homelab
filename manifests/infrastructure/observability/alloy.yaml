---
# Alloy — Unified telemetry collector
#
# WHAT THIS REPLACES:
#   - node-exporter (host metrics)
#   - promtail (log shipping)
#
# HOW IT WORKS:
#   - Runs as DaemonSet on every node
#   - Collects host metrics (CPU, memory, disk, network)
#   - Tails container logs from /var/log/pods
#   - Pushes metrics to Prometheus, logs to Loki
#
# WHY ALLOY:
#   - Promtail is deprecated (EOL March 2026)
#   - Alloy is Grafana's recommended replacement
#   - Single agent instead of two DaemonSets
#
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: alloy
      version: "0.12.6"
      sourceRef:
        kind: HelmRepository
        name: grafana
  values:
    # Run as DaemonSet on all nodes
    controller:
      type: daemonset
    
    # Lightweight — runs on RPis too
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    
    # Tolerate all taints to run everywhere
    tolerations:
      - operator: Exists
    
    # Alloy config (River language)
    alloy:
      configMap:
        content: |
          // ========================================
          // HOST METRICS (replaces node-exporter)
          // ========================================
          
          prometheus.exporter.unix "node" {
            // Collectors to enable
            set_collectors = [
              "cpu",
              "diskstats",
              "filesystem",
              "loadavg",
              "meminfo",
              "netdev",
              "uname",
            ]
          }
          
          prometheus.scrape "node" {
            targets    = prometheus.exporter.unix.node.targets
            forward_to = [prometheus.remote_write.prometheus.receiver]
            
            scrape_interval = "30s"
            job_name        = "node-exporter"
          }
          
          prometheus.remote_write "prometheus" {
            endpoint {
              url = "http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/write"
            }
          }
          
          // ========================================
          // CONTAINER LOGS (replaces promtail)
          // ========================================
          
          discovery.kubernetes "pods" {
            role = "pod"
          }
          
          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets
            
            // Keep only running pods
            rule {
              source_labels = ["__meta_kubernetes_pod_phase"]
              regex         = "Pending|Succeeded|Failed"
              action        = "drop"
            }
            
            // Set namespace label
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            
            // Set pod label
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            
            // Set container label
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            
            // Build log path
            rule {
              source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              target_label  = "__path__"
              replacement   = "/var/log/pods/*$1/*.log"
            }
          }
          
          local.file_match "pods" {
            path_targets = discovery.relabel.pods.output
          }
          
          loki.source.file "pods" {
            targets    = local.file_match.pods.targets
            forward_to = [loki.write.loki.receiver]
          }
          
          loki.write "loki" {
            endpoint {
              url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
            }
          }
    
    # Mount host paths for metrics and logs
    mounts:
      varlog: true
      dockercontainers: false
