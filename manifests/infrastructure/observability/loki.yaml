---
# Loki — Log aggregation
#
# WHAT THIS DEPLOYS:
#   - Loki in SingleBinary mode (simple, good for homelab)
#   - Stores logs on Longhorn PVC
#   - 14-day retention
#
# HOW IT WORKS:
#   Alloy (DaemonSet) → pushes logs → Loki → Grafana queries
#
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: observability
spec:
  interval: 1h
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: "7.3.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
  values:
    # SingleBinary mode — all components in one pod
    deploymentMode: SingleBinary
    
    loki:
      auth_enabled: false
      
      # Filesystem storage (Longhorn PVC)
      storage:
        type: filesystem
      
      # Retention
      limits_config:
        retention_period: 336h  # 14 days
      
      # Schema
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      
      commonConfig:
        replication_factor: 1
    
    # Single binary deployment
    singleBinary:
      replicas: 1
      
      nodeSelector:
        kubernetes.io/hostname: xialing
      
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
      
      persistence:
        enabled: true
        storageClass: longhorn-observability
        size: 20Gi
    
    # Disable distributed components
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    
    # Disable extras
    gateway:
      enabled: false
    test:
      enabled: false
    monitoring:
      selfMonitoring:
        enabled: false
        grafanaAgent:
          installOperator: false
      lokiCanary:
        enabled: false
