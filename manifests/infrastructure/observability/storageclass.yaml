---
# StorageClass for observability stack
# 2 replicas restricted to nodes with observability-storage tag (peggy/yelena)
# Delete policy — PVCs cleaned up automatically; data survives Helm uninstall/reinstall
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-observability
provisioner: driver.longhorn.io
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  nodeSelector: "observability-storage"
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
