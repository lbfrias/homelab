---
# NetworkAttachmentDefinition for LAN (10.0.0.0/24)
# Uses unified 'eno1' interface (configured via unified_lan_interface Ansible role)
# Uses static IPAM - IP must be specified in pod annotation
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: macvlan-lan
  namespace: default
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "macvlan-lan",
      "type": "macvlan",
      "master": "eno1",
      "mode": "bridge",
      "ipam": {
        "type": "static"
      }
    }
