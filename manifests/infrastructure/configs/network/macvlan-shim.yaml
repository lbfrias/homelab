---
# macvlan-shim DaemonSet
# Creates a shim interface on each node to enable host-to-macvlan-pod communication
# Without this, the node cannot communicate with pods using macvlan on the same node
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: macvlan-shim
  namespace: kube-system
  labels:
    app: macvlan-shim
spec:
  selector:
    matchLabels:
      app: macvlan-shim
  template:
    metadata:
      labels:
        app: macvlan-shim
    spec:
      hostNetwork: true
      hostPID: true
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      initContainers:
        - name: setup-shim
          image: alpine:3.24
          command:
            - /bin/sh
            - -c
            - |
              set -ex
              apk add --no-cache iproute2
              
              # Detect parent interface (eth0 for RPi, eno1 for x86)
              if ip link show eno1 >/dev/null 2>&1; then
                PARENT="eno1"
              else
                PARENT="eth0"
              fi
              
              # Create LAN shim if it doesn't exist
              if ! ip link show macvlan-shim-lan >/dev/null 2>&1; then
                ip link add macvlan-shim-lan link $PARENT type macvlan mode bridge
                # Use an IP in the excluded range for the shim
                ip addr add 10.0.0.240/32 dev macvlan-shim-lan
                ip link set macvlan-shim-lan up
                # Route the macvlan pod range through the shim
                ip route add 10.0.0.200/29 dev macvlan-shim-lan || true
                ip route add 10.0.0.208/28 dev macvlan-shim-lan || true
                ip route add 10.0.0.224/28 dev macvlan-shim-lan || true
              fi
              
              echo "macvlan-shim setup complete for interface $PARENT"
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: "1m"
              memory: "4Mi"
            limits:
              cpu: "1m"
              memory: "4Mi"
