---
# NetworkAttachmentDefinition for DNS infrastructure (Technitium)
# Uses Whereabouts IPAM for automatic IP assignment from a dedicated range
# Range: 10.0.0.95-10.0.0.97 (exactly 3 IPs for 3 Technitium pods)
#
# Routes: Added for cross-VLAN access (all 10.0.x.x subnets)
# Without these, return traffic uses eth0 (cluster CNI) instead of macvlan
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: macvlan-dns-technitium
  namespace: dns
spec:
  config: |
    {
      "cniVersion": "1.1.0",
      "cniVersions": ["0.3.1", "0.4.0", "1.0.0", "1.1.0"],
      "name": "macvlan-dns-technitium",
      "plugins": [
        {
          "type": "macvlan",
          "master": "eno1",
          "mode": "bridge",
          "ipam": {
            "type": "whereabouts",
            "range": "10.0.0.95-10.0.0.97/24",
            "gateway": "10.0.0.1",
            "routes": [
              { "dst": "10.0.0.0/16", "gw": "10.0.0.1" }
            ]
          }
        }
      ]
    }
---
