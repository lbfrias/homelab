---
# NetworkAttachmentDefinition for IoT VLAN (10.0.30.0/24)
# Used by Home Assistant for device discovery
# Uses unified 'eno1' interface (configured via unified_lan_interface Ansible role)
# Interface name is eno1.300 (VLAN 300 carries the 10.0.30.0/24 network)
# Uses static IPAM - IP must be specified in pod annotation
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: macvlan-iot
  namespace: default
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "macvlan-iot",
      "type": "macvlan",
      "master": "eno1.300",
      "mode": "bridge",
      "ipam": {
        "type": "static",
        "routes": [
          { "dst": "0.0.0.0/0" },
        ],
        "gateway": "10.0.30.1"
      }
    }
