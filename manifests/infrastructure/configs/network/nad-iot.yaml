---
# NetworkAttachmentDefinition for IoT VLAN (10.0.30.0/24)
# Used by Home Assistant for device discovery
# Parent interface varies by node: eth0 (RPi), eno1 (x86)
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: macvlan-iot
  namespace: default
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "macvlan-iot",
      "type": "macvlan",
      "master": "eth0.30",
      "mode": "bridge",
      "ipam": {
        "type": "whereabouts",
        "range": "10.0.30.0/24",
        "exclude": [
          "10.0.30.1/32"
        ],
        "range_start": "10.0.30.200",
        "range_end": "10.0.30.239"
      }
    }
---
# NetworkAttachmentDefinition for IoT VLAN on x86 nodes (xialing)
# Uses eno1.30 instead of eth0.30
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: macvlan-iot-x86
  namespace: default
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "macvlan-iot-x86",
      "type": "macvlan",
      "master": "eno1.30",
      "mode": "bridge",
      "ipam": {
        "type": "whereabouts",
        "range": "10.0.30.0/24",
        "exclude": [
          "10.0.30.1/32"
        ],
        "range_start": "10.0.30.200",
        "range_end": "10.0.30.239"
      }
    }
