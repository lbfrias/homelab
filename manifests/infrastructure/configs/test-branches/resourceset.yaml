---
# Generate GitRepository + Kustomization for each test/* branch
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: test-deployments
  namespace: flux-system
spec:
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: test-branches
  resources:
    # GitRepository tracking the test branch
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      metadata:
        name: test-<< inputs.id >>
        namespace: flux-system
      spec:
        interval: 1m
        url: https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}
        ref:
          branch: << inputs.branch >>
        secretRef:
          name: flux-system

    # Kustomization deploying manifests from the branch to test namespace
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: test-<< inputs.id >>
        namespace: flux-system
        annotations:
          # Metadata for tracking
          fluxcd.controlplane.io/branch: << inputs.branch | quote >>
          fluxcd.controlplane.io/commit: << inputs.sha | quote >>
      spec:
        interval: 5m
        sourceRef:
          kind: GitRepository
          name: test-<< inputs.id >>
        # Derive path from branch: test/media → ./manifests/apps/media
        path: ./manifests/apps/<< inputs.branch | trimPrefix "test/" >>
        prune: true
        targetNamespace: test
