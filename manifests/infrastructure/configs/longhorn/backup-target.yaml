---
# BackupTarget CR — Longhorn 1.8+ manages backup targets via this CR
# The Helm chart's defaultSettings.backupTarget doesn't update existing CRs
apiVersion: longhorn.io/v1beta2
kind: BackupTarget
metadata:
  name: default
  namespace: longhorn-system
spec:
  backupTargetURL: "nfs://10.0.0.13:/mnt/data/library/longhorn_backup"
  credentialSecret: ""
  pollInterval: 5m0s
