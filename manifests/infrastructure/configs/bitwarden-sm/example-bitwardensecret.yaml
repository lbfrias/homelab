# Example BitwardenSecret - uncomment and customize after setup
#
# Prerequisites:
# 1. Create auth token secret: kubectl create secret generic bw-auth-token -n default --from-literal=token="<TOKEN>"
# 2. Get your Organization ID from Bitwarden
# 3. Get secret IDs from Bitwarden Secrets Manager
#
# ---
# apiVersion: k8s.bitwarden.com/v1
# kind: BitwardenSecret
# metadata:
#   name: example-secret
#   namespace: default
# spec:
#   organizationId: "<YOUR_ORG_ID>"
#   secretName: my-synced-secret
#   authToken:
#     secretName: bw-auth-token
#     secretKey: token
#   # Option 1: Sync all secrets the machine account can access
#   # onlyMappedSecrets: false
#   #
#   # Option 2: Map specific secrets (recommended)
#   onlyMappedSecrets: true
#   map:
#     - bwSecretId: "<BITWARDEN_SECRET_ID>"
#       secretKeyName: my-secret-key
