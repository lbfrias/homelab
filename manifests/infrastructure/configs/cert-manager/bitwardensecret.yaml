---
# Cloudflare API Token for cert-manager DNS-01 challenge
# Token needs Zone:DNS:Edit permission for frias.app
# Create the secret in Bitwarden Secrets Manager, then add the ID below
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  organizationId: "06ae1d0a-2e36-4299-958d-b4930153f890"
  secretName: cloudflare-api-token
  authToken:
    secretName: bw-auth-token
    secretKey: token
  onlyMappedSecrets: true
  map:
    - bwSecretId: "5e35e756-70e5-40f8-8a54-b49b00167290"
      secretKeyName: api-token
