---
# Provision a single node
# Usage: ansible-playbook provision-node.yaml -e @vars.local.yaml -e node=peggy -e device=/dev/sdd

- name: Provision node
  hosts: localhost
  gather_facts: false
  
  vars_files:
    - vars.yaml

  vars:
    raspios_dir_url: "https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-{{ raspios_version }}/"

  tasks:
    # Validate inputs
    - name: Validate node and device specified
      assert:
        that:
          - node is defined
          - device is defined
        fail_msg: "Usage: ansible-playbook provision-node.yaml -e @vars.local.yaml -e node=<name> -e device=/dev/sdX"

    - name: Validate node exists in vars.yaml
      assert:
        that: node in (nodes | map(attribute='name') | list)
        fail_msg: "Node '{{ node }}' not found in vars.yaml. Available: {{ nodes | map(attribute='name') | join(', ') }}"

    - name: Get node info
      set_fact:
        target_node: "{{ nodes | selectattr('name', 'eq', node) | first }}"

    # Pre-flight checks
    - name: Check for rpi-imager
      command: which rpi-imager
      register: rpi_imager_check
      failed_when: false
      changed_when: false
      when: target_node.os == 'raspios'

    - name: Check for wipefs
      command: which wipefs
      register: wipefs_check
      failed_when: false
      changed_when: false

    - name: Collect missing commands
      set_fact:
        missing_commands: >-
          {{
            ([] +
              (['rpi-imager'] if (target_node.os == 'raspios' and rpi_imager_check.rc != 0) else []) +
              (['wipefs'] if wipefs_check.rc != 0 else []))
          }}

    - name: Fail if required commands missing
      fail:
        msg: "Missing required commands: {{ missing_commands | join(', ') }}. Please install them before running."
      when: missing_commands | length > 0

    # Generate cloud-init for this node
    - name: Create output directory
      file:
        path: "{{ playbook_dir }}/output/{{ node }}"
        state: directory

    - name: Generate user-data
      template:
        src: templates/user-data.j2
        dest: "{{ playbook_dir }}/output/{{ node }}/user-data"
      vars:
        item: "{{ target_node }}"

    # Download and flash (raspios)
    - name: Discover RPi OS image filename
      uri:
        url: "{{ raspios_dir_url }}"
        return_content: true
      register: raspios_dir_listing
      when: target_node.os == 'raspios'

    - name: Extract image filename from directory listing
      set_fact:
        raspios_filename: "{{ raspios_dir_listing.content | regex_search('([0-9]{4}-[0-9]{2}-[0-9]{2}-raspios-trixie-arm64-lite\\.img\\.xz)') }}"
      when: target_node.os == 'raspios'

    - name: Validate image filename found
      assert:
        that: raspios_filename | length > 0
        fail_msg: "Could not find .img.xz file in {{ raspios_dir_url }}"
      when: target_node.os == 'raspios'

    - name: Set image paths
      set_fact:
        raspios_url: "{{ raspios_dir_url }}{{ raspios_filename }}"
        raspios_image: "/tmp/{{ raspios_filename }}"
      when: target_node.os == 'raspios'

    - name: Download Raspberry Pi OS image
      get_url:
        url: "{{ raspios_url }}"
        dest: "{{ raspios_image }}"
        mode: '0644'
      when: target_node.os == 'raspios'

    - name: Unmount device partitions
      shell: "umount {{ device }}* 2>/dev/null || true"
      become: true

    - name: Wipe device
      command: "wipefs -af {{ device }}"
      become: true

    - name: Flash RPi OS with cloud-init
      command: >
        rpi-imager --cli --disable-verify --enable-writing-system-drives
        --cloudinit-userdata {{ playbook_dir }}/output/{{ node }}/user-data
        {{ raspios_image }} {{ device }}
      become: true
      when: target_node.os == 'raspios'

    - name: Flash complete
      debug:
        msg: "{{ node }} flashed to {{ device }}. Remove SD card and boot."
