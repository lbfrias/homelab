# Provisioning Variables — Infrastructure
# Sensitive values go in vars.local.yaml (see vars.local.example.yaml)

# OS image versions (downloaded automatically)
# RPi: Use directory date from https://downloads.raspberrypi.com/raspios_lite_arm64/images/
# Rocky: https://download.rockylinux.org/pub/rocky/10/isos/x86_64/
raspios_version: "2026-06-19"
rocky_major_version: "10"

# System locale and timezone
timezone: "Asia/Manila"
locale: "en_US.UTF-8"
keyboard_layout: "us"

# NTP servers (defaults to Philippine NIST servers + global pool)
ntp_servers:
  - 0.asia.pool.ntp.org
  - 1.asia.pool.ntp.org
  - 2.asia.pool.ntp.org
  - 3.asia.pool.ntp.org

nodes:
  - name: peggy
    os: raspios
  - name: yelena
    os: raspios
  - name: xialing
    os: rocky
