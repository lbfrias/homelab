---
# Step 3: K3s HA Cluster Bootstrap
#
# Usage (from ansible/ dir):
#   ansible-playbook -e @vars.yaml playbooks/k3s.yaml
#
# Prerequisites:
#   - Run bootstrap.yaml first (Step 2)
#   - For fresh install: generate token with `openssl rand -hex 32`
#
# Cluster topology:
#   - xialing: first server (--cluster-init)
#   - peggy, yelena: join via xialing
#   - All nodes are control-plane + worker

# Play 0: Install K8s prerequisites (kernel modules, sysctl)
- name: K3s Prerequisites
  hosts: k3s_cluster
  become: true
  vars:
    k8s_kernel_modules:
      - br_netfilter
      - overlay
    k8s_sysctl:
      - { key: "net.bridge.bridge-nf-call-iptables", value: "1" }
      - { key: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
      - { key: "net.ipv4.ip_forward", value: "1" }
  tasks:
    # OS-specific packages needed for K3s
    - name: Install K3s dependencies (Rocky)
      when: ansible_os_family == "RedHat"
      ansible.builtin.dnf:
        name:
          - iptables
          - container-selinux
          - kernel-modules-extra
        state: present

    - name: Install K3s dependencies (Debian)
      when: ansible_os_family == "Debian"
      ansible.builtin.apt:
        name:
          - iptables
          - iptables-persistent
        state: present

    # Kernel modules for container networking
    - name: Load K8s required kernel modules
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop: "{{ k8s_kernel_modules }}"
      register: modprobe_result
      ignore_errors: true

    - name: Fail with helpful message if br_netfilter unavailable
      when: modprobe_result.results | selectattr('item', 'eq', 'br_netfilter') | selectattr('failed', 'true') | list | length > 0
      ansible.builtin.fail:
        msg: |
          br_netfilter module not available for running kernel ({{ ansible_kernel }}).
          This usually means kernel-modules-extra doesn't match the running kernel.
          Try: reboot and re-run playbook (GRUB may boot a kernel with modules available).

    - name: Persist kernel modules across reboots
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          {% for module in k8s_kernel_modules %}
          {{ module }}
          {% endfor %}
        mode: "0644"

    # Sysctl for K8s networking
    - name: Set sysctl for K8s networking
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/k8s.conf
        reload: true
      loop: "{{ k8s_sysctl }}"

    # Raspberry Pi OS: enable cgroup memory for containers
    - name: Check if cgroup memory is enabled (RPi)
      when: ansible_os_family == "Debian"
      ansible.builtin.command: grep -q 'cgroup_memory=1' /boot/firmware/cmdline.txt
      register: cgroup_check
      failed_when: false
      changed_when: false

    - name: Enable cgroup memory (RPi)
      when:
        - ansible_os_family == "Debian"
        - cgroup_check.rc != 0
      ansible.builtin.lineinfile:
        path: /boot/firmware/cmdline.txt
        backrefs: true
        regexp: '^(.*)$'
        line: '\1 cgroup_memory=1 cgroup_enable=memory'
      register: cmdline_updated

    # Unified interface naming: Rename RPi eth0 → eno1 to match x86 standard
    # This enables macvlan NADs to use same master interface across all nodes
    - name: Check if interface is already eno1
      ansible.builtin.set_fact:
        interface_already_eno1: "{{ ansible_default_ipv4.interface == 'eno1' }}"

    - name: Get MAC address of primary interface (for rename)
      when: not interface_already_eno1
      ansible.builtin.shell: |
        ip link show {{ ansible_default_ipv4.interface }} | grep -oP 'link/ether \K[0-9a-f:]+' | tr '[:lower:]' '[:upper:]'
      register: primary_mac
      changed_when: false

    - name: Create systemd.link to rename interface to eno1
      when: not interface_already_eno1
      ansible.builtin.copy:
        dest: /etc/systemd/network/10-eno1.link
        mode: "0644"
        content: |
          # Unified LAN interface naming for macvlan compatibility
          # Renames primary ethernet to 'eno1' to match x86 standard naming
          [Match]
          MACAddress={{ primary_mac.stdout }}

          [Link]
          Name=eno1
      register: interface_link_created

    - name: Update netplan interface name to eno1 (RPi)
      when:
        - not interface_already_eno1
        - ansible_os_family == "Debian"
      ansible.builtin.replace:
        path: /etc/netplan/50-cloud-init.yaml
        regexp: '(\s+)(eth0|end0):'
        replace: '\1eno1:'
      failed_when: false
      register: netplan_updated

    - name: Check if K3s is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_installed

    - name: Reboot to apply kernel/sysctl/cgroup/interface changes (fresh install only)
      when: not k3s_installed.stat.exists
      ansible.builtin.reboot:
        reboot_timeout: 300
        msg: "Rebooting to apply kernel modules, sysctl, and interface naming before K3s install"

    # Rolling reboot for existing cluster if interface was renamed
    # Uses serial: 1 at play level to reboot one node at a time
    - name: Set reboot needed flag
      ansible.builtin.set_fact:
        needs_interface_reboot: "{{ interface_link_created.changed | default(false) and k3s_installed.stat.exists }}"

- name: Rolling reboot for interface rename (existing cluster)
  hosts: k3s_cluster
  become: true
  serial: 1
  tasks:
    - name: Reboot node for interface rename
      when: needs_interface_reboot | default(false)
      block:
        - name: "Rebooting {{ inventory_hostname }} for interface rename"
          ansible.builtin.reboot:
            reboot_timeout: 300
            msg: "Rebooting to apply interface rename (eth0 → eno1)"

        - name: Wait for K3s to be ready after reboot
          ansible.builtin.command: kubectl get nodes
          register: kubectl_result
          until: kubectl_result.rc == 0
          retries: 30
          delay: 10
          changed_when: false

# Play 1: Install K3s on first server (xialing)
- name: K3s First Server Bootstrap
  hosts: xialing
  become: true
  vars_prompt:
    - name: k3s_token_input
      prompt: "Enter K3s token (leave empty to fetch from xialing if already initialized)"
      private: true
      default: ""

  vars:
    k3s_disable_components:
      - servicelb
      - traefik

  pre_tasks:
    - name: Check if K3s token file exists
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_stat

    - name: Set token from input
      when: k3s_token_input != ""
      ansible.builtin.set_fact:
        k3s_token: "{{ k3s_token_input }}"

    - name: Read existing token if available
      when:
        - k3s_token_input == ""
        - k3s_token_stat.stat.exists
      block:
        - name: Slurp token file
          ansible.builtin.slurp:
            src: /var/lib/rancher/k3s/server/node-token
          register: k3s_token_file

        - name: Set token from file
          ansible.builtin.set_fact:
            k3s_token: "{{ k3s_token_file.content | b64decode | trim }}"

    - name: Fail if no token available for fresh install
      when:
        - k3s_token_input == ""
        - not k3s_token_stat.stat.exists
      ansible.builtin.fail:
        msg: "K3s token required for fresh install. Generate with: openssl rand -hex 32"

  tasks:
    - name: Check if K3s is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: Install K3s (cluster-init)
      when: not k3s_binary.stat.exists
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | sh -s - server \
          --cluster-init \
          --token "{{ k3s_token }}" \
          --disable {{ k3s_disable_components | join(' --disable ') }} \
          --write-kubeconfig-mode 644
      args:
        creates: /usr/local/bin/k3s

    - name: Ensure K3s service is enabled and started
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: true
        daemon_reload: true

    - name: Wait for K3s to be ready
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        state: present
        timeout: 120

    - name: Wait for API server
      ansible.builtin.command: /usr/local/bin/k3s kubectl get nodes
      register: kubectl_check
      until: kubectl_check.rc == 0
      retries: 30
      delay: 10
      changed_when: false


# Play 2: Install K3s on joining servers (peggy, yelena)
- name: K3s Join Servers
  hosts: rpi
  become: true

  vars:
    k3s_first_server: xialing
    k3s_server_url: "https://{{ node_ips.xialing }}:6443"
    k3s_disable_components:
      - servicelb
      - traefik

  pre_tasks:
    - name: Read token from first server
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_file
      delegate_to: "{{ k3s_first_server }}"

    - name: Set token fact
      ansible.builtin.set_fact:
        k3s_token: "{{ k3s_token_file.content | b64decode | trim }}"

  tasks:
    - name: Check if K3s is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: Install K3s (join cluster)
      when: not k3s_binary.stat.exists
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | sh -s - server \
          --server "{{ k3s_server_url }}" \
          --token "{{ k3s_token }}" \
          --disable {{ k3s_disable_components | join(' --disable ') }} \
          --write-kubeconfig-mode 644
      args:
        creates: /usr/local/bin/k3s

    - name: Ensure K3s service is enabled and started
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: true
        daemon_reload: true


# Play 3: Verify cluster and extract kubeconfig
- name: Verify K3s Cluster
  hosts: xialing
  become: true
  vars:
    kubeconfig_local_path: "~/.kube/config-homelab"
  tasks:
    - name: Wait for all nodes
      ansible.builtin.command: /usr/local/bin/k3s kubectl get nodes
      register: kubectl_nodes
      until:
        - kubectl_nodes.rc == 0
        - "'peggy' in kubectl_nodes.stdout"
        - "'yelena' in kubectl_nodes.stdout"
        - "'xialing' in kubectl_nodes.stdout"
      retries: 30
      delay: 10
      changed_when: false

    - name: Show cluster nodes
      ansible.builtin.debug:
        msg: "{{ kubectl_nodes.stdout_lines }}"

    - name: Fetch kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: kubeconfig_raw

    - name: Save kubeconfig locally
      delegate_to: localhost
      become: false
      block:
        - name: Ensure ~/.kube directory exists
          ansible.builtin.file:
            path: "{{ kubeconfig_local_path | dirname | expanduser }}"
            state: directory
            mode: "0700"

        - name: Write kubeconfig with corrected server URL
          ansible.builtin.copy:
            content: "{{ kubeconfig_raw.content | b64decode | regex_replace('127\\.0\\.0\\.1', ansible_host) }}"
            dest: "{{ kubeconfig_local_path | expanduser }}"
            mode: "0600"

        - name: Show kubeconfig location
          ansible.builtin.debug:
            msg: "Kubeconfig saved to {{ kubeconfig_local_path }}. Use: KUBECONFIG={{ kubeconfig_local_path }} kubectl get nodes"
