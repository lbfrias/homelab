---
# Step 4: Flux GitOps Bootstrap
#
# Usage (from ansible/ dir):
#   ansible-playbook -e @vars.yaml -e @secrets.local.yaml playbooks/flux.yaml
#
# Prerequisites:
#   - K3s cluster running (Step 3 complete)
#   - Kubeconfig configured (default: ~/.kube/config)
#   - GitHub token in secrets.local.yaml: github_token
#   - GitHub repo configured: github_owner, github_repo
#
# What this does:
#   - Installs Flux CLI on localhost (the control machine)
#   - Bootstraps Flux with GitHub source
#   - Flux watches manifests/ directory for workloads
#
# After completion:
#   - Flux auto-reconciles manifests/
#   - Add infrastructure and apps to manifests/ to deploy

- name: Bootstrap Flux GitOps
  hosts: localhost
  connection: local

  vars:
    flux_version: "2.9.3"
    flux_namespace: flux-system
    flux_path: "manifests"
    flux_branch: main

  pre_tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - github_token is defined
          - github_owner is defined
          - github_repo is defined
        fail_msg: |
          Missing required variables. Add github_owner/github_repo to vars.yaml and github_token to secrets.local.yaml:
            github_token: ghp_xxx
            github_owner: your-username
            github_repo: homelab

  tasks:
    - name: Check Flux CLI version
      ansible.builtin.command: flux version --client -o json
      register: flux_cli_version
      failed_when: false
      changed_when: false

    - name: Install or upgrade Flux CLI
      when: >
        flux_cli_version.rc != 0 or
        (flux_cli_version.stdout | from_json).flux != 'v' + flux_version
      become: true
      ansible.builtin.shell: |
        curl -s https://fluxcd.io/install.sh | FLUX_VERSION={{ flux_version }} bash

    - name: Check if Flux is already bootstrapped
      ansible.builtin.command: kubectl get namespace {{ flux_namespace }}
      register: flux_ns_check
      failed_when: false
      changed_when: false

    - name: Bootstrap Flux with GitHub
      when: flux_ns_check.rc != 0
      ansible.builtin.shell: |
        flux bootstrap github \
          --owner={{ github_owner }} \
          --repository={{ github_repo }} \
          --branch={{ flux_branch }} \
          --path={{ flux_path }} \
          --personal
      environment:
        GITHUB_TOKEN: "{{ github_token }}"

    - name: Wait for Flux to be ready
      ansible.builtin.command: >
        kubectl wait --for=condition=Ready
        pods -n {{ flux_namespace }} --all --timeout=120s
      retries: 3
      delay: 10
      changed_when: false

    - name: Verify Flux reconciliation
      ansible.builtin.command: flux get all -A
      register: flux_status
      changed_when: false

    - name: Show Flux status
      ansible.builtin.debug:
        msg: "{{ flux_status.stdout_lines }}"

    - name: Show next steps
      ansible.builtin.debug:
        msg: |
          ✅ Flux bootstrap complete!

          Next steps:
          1. Add infrastructure manifests to: manifests/infrastructure/
          2. Add app manifests to: manifests/apps/
          3. Push to GitHub — Flux will auto-reconcile

          Monitor with:
            flux get all -A
            kubectl get pods -A
