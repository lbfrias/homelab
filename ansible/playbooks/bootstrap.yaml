---
# Step 2: Bootstrap - OS-specific setup and NFS/SMB
#
# Usage (from ansible/ dir):
#   ansible-playbook -e @vars.local.yaml playbooks/bootstrap.yaml
#
# What this does:
#   - Updates package cache
#   - Disables firewalld on Rocky Linux
#   - Enables cgroup memory on RPi (reboots if needed)
#   - Configures NFS/SMB server on xialing
#
# Prerequisites:
#   - Nodes provisioned (Step 1) and reachable via SSH

- name: Bootstrap all cluster nodes
  hosts: k3s_cluster
  become: true
  roles:
    - common

- name: Configure NFS/SMB on xialing
  hosts: xialing
  become: true
  roles:
    - role: nfs_smb
      tags: nfs

- name: Configure IoT VLAN interface on xialing
  hosts: xialing
  become: true
  vars:
    vlan_parent: eno1
    vlan_id: "{{ iot_vlan_id }}"
  roles:
    - role: vlan_interface
      tags: vlan
