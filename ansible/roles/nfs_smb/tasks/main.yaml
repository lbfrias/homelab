---
# Install and configure NFS server and Samba on xialing
# Exports /mnt/data (4TB USB HDD) for cluster storage and media

- name: Install NFS and Samba packages
  ansible.builtin.dnf:
    name:
      - nfs-utils
      - samba
      - samba-common
    state: present
  tags: packages

- name: Ensure export directory exists
  ansible.builtin.file:
    path: "{{ nfs_export_path }}"
    state: directory
    mode: '0755'

- name: Ensure Longhorn backup directory exists
  ansible.builtin.file:
    path: "{{ nfs_export_path }}/library/longhorn_backup"
    state: directory
    mode: '0755'

- name: Configure NFS exports
  ansible.builtin.lineinfile:
    path: /etc/exports
    line: "{{ nfs_export_path }} {{ nfs_export_network }}({{ nfs_export_options }})"
    create: true
    mode: '0644'
  notify: Reload NFS exports

- name: Enable and start NFS server
  ansible.builtin.systemd:
    name: nfs-server
    enabled: true
    state: started

- name: Configure Samba share
  ansible.builtin.blockinfile:
    path: /etc/samba/smb.conf
    block: |
      [{{ smb_share_name }}]
        path = {{ smb_share_path }}
        browsable = yes
        read only = no
        guest ok = {{ 'yes' if smb_guest_ok else 'no' }}
        force user = {{ smb_force_user }}
    marker: "# {mark} ANSIBLE MANAGED - {{ smb_share_name }}"
  notify: Restart Samba

- name: Enable and start Samba
  ansible.builtin.systemd:
    name: smb
    enabled: true
    state: started
