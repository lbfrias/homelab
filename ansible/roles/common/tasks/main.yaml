---
# Common role - update package cache, upgrade packages, and install common packages

- name: Update package cache (Debian)
  when: ansible_facts['os_family'] == "Debian"
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Update package cache (RedHat)
  when: ansible_facts['os_family'] == "RedHat"
  ansible.builtin.dnf:
    update_cache: true

- name: Upgrade all packages (Debian)
  when: ansible_facts['os_family'] == "Debian"
  ansible.builtin.apt:
    upgrade: dist
    
- name: Upgrade all packages (RedHat)
  when: ansible_facts['os_family'] == "RedHat"
  ansible.builtin.dnf:
    name: "*"
    state: latest

- name: "Install OS-specific packages (RedHat): {{ common_packages_redhat | join(', ') }}"
  when:
    - ansible_facts['os_family'] == "RedHat"
    - common_packages_redhat | length > 0
  ansible.builtin.dnf:
    name: "{{ common_packages_redhat }}"
    state: present

- name: "Install OS-specific packages (Debian): {{ common_packages_debian | join(', ') }}"
  when:
    - ansible_facts['os_family'] == "Debian"
    - common_packages_debian | length > 0
  ansible.builtin.apt:
    name: "{{ common_packages_debian }}"
    state: present

- name: "Install common packages (Debian): {{ common_packages | join(', ') }}"
  when: ansible_facts['os_family'] == "Debian"
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: "Install common packages (RedHat): {{ common_packages | join(', ') }}"
  when: ansible_facts['os_family'] == "RedHat"
  ansible.builtin.dnf:
    name: "{{ common_packages }}"
    state: present

# Longhorn requires iscsid running
- name: Enable and start iscsid service
  ansible.builtin.systemd:
    name: iscsid
    state: started
    enabled: true
