---
# Common role defaults

# Packages for all nodes (cross-platform)
common_packages:
  - curl
  - jq
  - tar
  - vim

# OS-specific packages (installed before common_packages)
common_packages_debian:
  - glances
  - nfs-common
  - open-iscsi  # Required for Longhorn
common_packages_redhat:
  - epel-release
  - iscsi-initiator-utils  # Required for Longhorn
